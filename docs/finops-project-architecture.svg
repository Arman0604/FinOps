<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">FinOps Project Architecture</title>
  <desc id="desc">Cloud cost intelligence platform architecture showing frontend, backend API, data and ML pipeline, SQLite analytics database, API usage, and deployment flow.</desc>
  <defs>
    <style>
      .bg { fill: #f8fbff; }
      .title { font: 700 52px Arial, sans-serif; fill: #081936; }
      .subtitle { font: 400 28px Arial, sans-serif; fill: #102343; }
      .section-title { font: 700 20px Arial, sans-serif; }
      .box-title { font: 700 18px Arial, sans-serif; }
      .text { font: 400 15px Arial, sans-serif; fill: #14213d; }
      .small { font: 400 13px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #475569; }
      .blue { stroke: #1d76d3; fill: #eef7ff; }
      .green { stroke: #4f9148; fill: #f1fbf0; }
      .orange { stroke: #e09a21; fill: #fff7e8; }
      .purple { stroke: #7b4bc2; fill: #f5efff; }
      .panel { stroke-width: 1.5; rx: 12; }
      .inner { fill: #ffffff; stroke-width: 1.4; rx: 10; }
      .node { fill: #ffffff; stroke-width: 1.3; rx: 9; }
      .arrow { stroke: #111827; stroke-width: 2.8; fill: none; marker-end: url(#arrowhead); }
      .dataarrow { stroke: #111827; stroke-width: 2.3; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrowhead); }
      .apiarrow { stroke: #111827; stroke-width: 2.8; fill: none; marker-end: url(#arrowhead); }
      .line { stroke: #cbd5e1; stroke-width: 1; }
      .blueText { fill: #1268c3; }
      .greenText { fill: #237a31; }
      .orangeText { fill: #b56b00; }
      .purpleText { fill: #5d35a8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111827" />
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
  </defs>

